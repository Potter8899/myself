<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Potter — Personal Space</title>
<meta name="description" content="พื้นที่ส่วนตัวของ Potter: นักพัฒนา เว็บ บอท ม็อด Minecraft และโมเดล 3D">
<meta property="og:title" content="Potter — Personal Space"><meta property="og:type" content="website">
<meta property="og:description" content="Developer · Minecraft · 3D Modeling"><meta property="og:image" content="img/profile.jpg">
<meta name="theme-color" content="#050609">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="loader" aria-hidden="true"><div class="ring"></div><p>POTTER</p></div>
<canvas id="space" aria-hidden="true"></canvas><div class="nebula" aria-hidden="true"></div><div class="grid" aria-hidden="true"></div>
<div id="cursor" aria-hidden="true"></div>
<a class="skip" href="#main">ข้ามไปเนื้อหา</a>
<header class="nav glass">
  <a href="#top" class="logo">POTTER<span>.</span></a>
  <nav aria-label="หลัก"><a href="#about">About</a><a href="#skills">Skills</a><a href="#projects">Projects</a><a href="#interests">Interests</a><a href="#contact">Contact</a></nav>
  <button class="btn mag" id="authBtn" type="button">เข้าสู่ระบบ</button>
</header>
<main id="main">
<section id="top" class="hero">
  <div class="hero-text">
    <p class="eyebrow reveal" id="tagline"></p>
    <h1 class="reveal" id="heroName"></h1>
    <p class="lead reveal" id="intro"></p>
    <div class="reveal"><a href="#contact" class="btn primary mag">ติดต่อผม</a> <a href="#projects" class="btn mag">ดูผลงาน</a></div>
  </div>
  <figure class="tilt-wrap reveal">
    <button class="tilt" id="profileCard" type="button" aria-label="ขยายรูปโปรไฟล์">
      <img id="profileImg" src="img/profile.jpg" alt="รูปโปรไฟล์ Potter" width="420" height="520" fetchpriority="high">
      <span class="fallback" id="fallback" hidden>P</span><span class="shade"></span><span class="glare"></span>
    </button>
  </figure>
</section>
<section id="about" class="sec"><h2 class="reveal">About Me</h2><p class="reveal glass pad" id="about-text"></p></section>
<section id="skills" class="sec"><h2 class="reveal">My Skills</h2><div class="cards" id="skillList"></div></section>
<section id="projects" class="sec"><h2 class="reveal">My Projects</h2><div class="cards" id="projectList"></div></section>
<section id="interests" class="sec"><h2 class="reveal">My Interests</h2><div class="chips reveal" id="interestList"></div></section>
<section id="contact" class="sec"><h2 class="reveal">Contact</h2>
  <div class="cards" id="socialList"></div>
  <p class="reveal lead">มีงานอยากคุย? กดปุ่มแชตมุมขวาล่าง ข้อความจะถึง Potter ทาง Discord ทันที</p>
</section>
</main>
<footer class="foot"><span>© <span id="year"></span> Potter</span><span id="botStatus" class="pill" data-s="off">Bot: …</span></footer>

<button id="chatFab" class="fab btn primary mag" type="button" aria-label="เปิดแชต">💬 แชต</button>
<section id="chat" class="chat glass" hidden aria-label="แชตกับ Potter">
  <div class="chat-head"><b>แชตกับ Potter</b><span id="ticketPill" class="pill" data-s="off">ยังไม่มีตั๋ว</span><button type="button" id="chatClose" aria-label="ปิด">✕</button></div>
  <div id="msgs" class="msgs" aria-live="polite"></div>
  <div id="chatCap" class="cap" hidden><div class="cap-widget"></div><div class="cap-status" data-s="idle"><span class="dot"></span><span class="txt"></span><button type="button" class="retry" hidden>ลองใหม่</button></div></div>
  <form id="chatForm" class="chat-form"><input id="chatInput" maxlength="1500" placeholder="พิมพ์ข้อความ…" autocomplete="off" required><button class="btn primary" type="submit">ส่ง</button></form>
</section>

<div id="authModal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="authTitle">
  <form id="authForm" class="glass pad box" novalidate>
    <button type="button" class="x" data-close aria-label="ปิด">✕</button>
    <h3 id="authTitle">เข้าสู่ระบบ</h3>
    <div class="tabs"><button type="button" data-tab="login" class="on">เข้าสู่ระบบ</button><button type="button" data-tab="register">สมัครสมาชิก</button></div>
    <label>ชื่อผู้ใช้<input name="username" required minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+" autocomplete="username"></label>
    <label data-only="register">อีเมล<input name="email" type="email" maxlength="254" autocomplete="email"></label>
    <label>รหัสผ่าน (อย่างน้อย 8 ตัว)<input name="password" type="password" required minlength="8" maxlength="72" autocomplete="current-password"></label>
    <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div id="authCap" class="cap"><div class="cap-widget"></div><div class="cap-status" data-s="idle"><span class="dot"></span><span class="txt"></span><button type="button" class="retry" hidden>ลองใหม่</button></div></div>
    <p id="authErr" class="err" role="alert"></p>
    <button class="btn primary" type="submit" id="authSubmit">ยืนยัน</button>
  </form>
</div>
<div id="lightbox" class="modal lb" hidden role="dialog" aria-modal="true" aria-label="รูปโปรไฟล์">
  <button type="button" class="x" data-close aria-label="ปิด">✕</button><img id="lbImg" alt="รูปโปรไฟล์ Potter ขยาย">
</div>
<div id="toasts" aria-live="polite"></div>
<script src="content.js"></script><script src="script.js"></script>
</body></html>
